<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danielo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050708;
      --text: #f4f7f8;
      --muted: rgba(235, 245, 248, 0.55);
      --blue: #7ee8ff;
      --blue-soft: rgba(126, 232, 255, 0.15);
      --glass: rgba(255, 255, 255, 0.055);
      --glass-border: rgba(255, 255, 255, 0.11);
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 132, 255, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(0, 255, 225, 0.08),
          transparent 30%
        ),
        #050708;

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.015) 50%,
          transparent 100%
        );

      animation: backgroundMove 10s ease-in-out infinite alternate;
    }

    @keyframes backgroundMove {
      from {
        transform: translateX(-5%);
      }

      to {
        transform: translateX(5%);
      }
    }

    /* =========================
       SCREENS
    ========================= */

    .screen {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 28px;

      opacity: 0;
      pointer-events: none;

      filter: blur(14px);

      transform: scale(0.985);

      transition:
        opacity 0.9s ease,
        filter 0.9s ease,
        transform 0.9s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;

      filter: blur(0);
      transform: scale(1);
    }

    .content {
      width: min(900px, 92vw);
      text-align: center;
    }

    /* =========================
       BIRTHDAY
    ========================= */

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.34em;

      color: var(--muted);

      margin-bottom: 26px;
    }

    #birthdayText {
      font-size: clamp(42px, 8vw, 92px);

      font-weight: 650;

      letter-spacing: -0.045em;

      line-height: 0.98;

      min-height: 1.1em;

      text-wrap: balance;
    }

    .cursor {
      display: inline-block;

      width: 3px;
      height: 1em;

      margin-left: 7px;

      background: var(--blue);

      vertical-align: -0.1em;

      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .continue-btn {
      margin-top: 48px;

      padding: 14px 24px;

      border-radius: 999px;

      border: 1px solid var(--glass-border);

      background: rgba(255, 255, 255, 0.06);

      backdrop-filter: blur(18px);

      color: white;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 0.08em;

      cursor: pointer;

      opacity: 0;
      transform: translateY(8px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease,
        background 0.25s ease;
    }

    .continue-btn.show {
      opacity: 1;
      transform: translateY(0);
    }

    .continue-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* =========================
       GLASS CUBE
    ========================= */

    .gift-label {
      font-size: 12px;

      color: var(--muted);

      letter-spacing: 0.16em;
      text-transform: uppercase;

      margin-bottom: 44px;
    }

    .gift-wrap {
      width: 210px;
      height: 210px;

      margin: 0 auto;

      display: flex;
      justify-content: center;
      align-items: center;

      perspective: 900px;
    }

    .glass-cube {
      position: relative;

      width: 135px;
      height: 135px;

      transform-style: preserve-3d;

      transform:
        rotateX(-16deg)
        rotateY(30deg);

      cursor: pointer;

      animation:
        floatCube 5s ease-in-out infinite;

      transition:
        transform 1.2s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes floatCube {
      0%, 100% {
        transform:
          rotateX(-16deg)
          rotateY(30deg)
          translateY(0);
      }

      50% {
        transform:
          rotateX(-12deg)
          rotateY(40deg)
          translateY(-10px);
      }
    }

    .glass-cube.open {
      animation: none;

      transform:
        rotateX(0deg)
        rotateY(0deg)
        scale(1.15);
    }

    .face {
      position: absolute;

      width: 135px;
      height: 135px;

      border:
        1px solid rgba(255, 255, 255, 0.14);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.11),
          rgba(255, 255, 255, 0.025)
        );

      backdrop-filter: blur(20px);

      box-shadow:
        inset 0 0 30px rgba(255, 255, 255, 0.025);
    }

    .front {
      transform: translateZ(67px);
    }

    .back {
      transform:
        rotateY(180deg)
        translateZ(67px);
    }

    .right {
      transform:
        rotateY(90deg)
        translateZ(67px);
    }

    .left {
      transform:
        rotateY(-90deg)
        translateZ(67px);
    }

    .top {
      transform:
        rotateX(90deg)
        translateZ(67px);
    }

    .bottom {
      transform:
        rotateX(-90deg)
        translateZ(67px);
    }

    .cube-light {
      position: absolute;

      width: 70px;
      height: 70px;

      left: 32px;
      top: 32px;

      border-radius: 50%;

      background:
        rgba(87, 219, 255, 0.55);

      filter: blur(32px);

      opacity: 0.55;

      transition:
        transform 1s ease,
        opacity 1s ease;
    }

    .glass-cube.open .cube-light {
      transform: scale(2.4);
      opacity: 1;
    }

    .tap-text {
      margin-top: 32px;

      color: var(--muted);

      font-size: 12px;

      letter-spacing: 0.08em;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message-card {
      width: min(760px, 92vw);

      margin: auto;

      padding:
        clamp(28px, 5vw, 54px);

      border-radius: 28px;

      border:
        1px solid var(--glass-border);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.07),
          rgba(255,255,255,0.025)
        );

      backdrop-filter: blur(28px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.3);
    }

    .message-label {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.28em;

      color: var(--muted);

      margin-bottom: 30px;
    }

    .message {
      font-size:
        clamp(16px, 2.2vw, 20px);

      line-height: 1.8;

      color:
        rgba(245, 249, 250, 0.87);

      white-space: pre-line;
    }

    #messageCursor {
      color: var(--blue);
    }

    /* =========================
       ENDING
    ========================= */

    #endingScreen {
      overflow: hidden;
    }

    .ending-card {
      position: relative;

      z-index: 10;

      width: min(760px, 92vw);

      min-height: 360px;

      padding:
        clamp(34px, 6vw, 62px);

      border-radius: 32px;

      border:
        1px solid var(--glass-border);

      background:
        rgba(255, 255, 255, 0.045);

      backdrop-filter: blur(28px);

      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.35);

      text-align: left;

      transition:
        opacity 1.4s ease,
        transform 1.4s ease,
        border-color 1.4s ease;
    }

    .system-label {
      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 11px;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      color: var(--blue);

      margin-bottom: 28px;
    }

    .ending-title {
      font-size:
        clamp(34px, 6vw, 68px);

      font-weight: 600;

      letter-spacing: -0.045em;

      line-height: 1;

      margin-bottom: 20px;
    }

    .ending-sub {
      font-size:
        clamp(18px, 3vw, 28px);

      color:
        rgba(245, 249, 250, 0.68);

      line-height: 1.4;
    }

    .system-details {
      margin-top: 42px;

      padding-top: 24px;

      border-top:
        1px solid rgba(255, 255, 255, 0.08);

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 20px;
    }

    .detail {
      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;

      line-height: 1.7;

      color: var(--muted);
    }

    .detail strong {
      color:
        rgba(255,255,255,0.9);

      font-weight: 500;
    }

    /* ORIGINAL ENDING FADE */

    #systemEnding {
      opacity: 1;

      transform: translateY(0);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #systemEnding.hide {
      opacity: 0;

      transform:
        translateY(-12px);
    }

    /* FINAL HAPPY BIRTHDAY
       SAME GLASS CARD / SAME THEME
    */

    .final-birthday {
      position: absolute;

      inset: 0;

      padding:
        clamp(34px, 6vw, 62px);

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      opacity: 0;

      transform:
        translateY(16px)
        scale(0.985);

      pointer-events: none;

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    .final-birthday.show {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }

    .final-birthday.fade {
      opacity: 0;

      transform:
        translateY(-10px)
        scale(0.99);
    }

    .final-label {
      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 11px;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: var(--blue);

      margin-bottom: 30px;
    }

    .final-birthday-text {
      font-size:
        clamp(38px, 7vw, 76px);

      font-weight: 600;

      letter-spacing: -0.045em;

      line-height: 1.05;

      color: #f4f7f8;

      text-shadow:
        0 0 40px
        rgba(126, 232, 255, 0.12);
    }

    .ending-card.final-fade {
      opacity: 0;

      transform:
        scale(0.985);

      border-color:
        rgba(255, 255, 255, 0);
    }

    /* =========================
       PARTICLE BLOOM
    ========================= */

    #bloom {
      position: fixed;
      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 5;
    }

    .bloom-particle {
      position: absolute;

      left: 50%;
      top: 50%;

      width: var(--size);
      height: var(--size);

      border-radius: 999px;

      background:
        rgba(160, 237, 255, 0.9);

      animation:
        bloomOut
        var(--duration)
        cubic-bezier(.15,.7,.15,1)
        forwards;
    }

    @keyframes bloomOut {
      0% {
        transform:
          translate(-50%, -50%)
          scale(0);

        opacity: 1;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(1);

        opacity: 0;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .system-details {
        grid-template-columns: 1fr;
      }

      .ending-card {
        text-align: center;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       BIRTHDAY
  ========================== -->

  <section
    class="screen active"
    id="birthdayScreen"
  >
    <div class="content">

      <div class="eyebrow">
        birthday update available
      </div>

      <div>
        <span id="birthdayText"></span><span
          id="birthdayCursor"
          class="cursor"
        ></span>
      </div>

      <button
        id="continueButton"
        class="continue-btn"
        onclick="showGift()"
      >
        continue
      </button>

    </div>
  </section>


  <!-- =========================
       GIFT
  ========================== -->

  <section
    class="screen"
    id="giftScreen"
  >
    <div class="content">

      <div class="gift-label">
        one thing before you go
      </div>

      <div class="gift-wrap">

        <div
          class="glass-cube"
          id="glassCube"
          onclick="openGift()"
        >

          <div class="cube-light"></div>

          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face right"></div>
          <div class="face left"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>

        </div>

      </div>

      <div class="tap-text">
        tap the cube
      </div>

    </div>
  </section>


  <!-- =========================
       MESSAGE
  ========================== -->

  <section
    class="screen"
    id="messageScreen"
  >

    <div class="message-card">

      <div class="message-label">
        for danielo
      </div>

      <div class="message">

        <span
          id="typedMessage"
        ></span><span
          id="messageCursor"
        >|</span>

      </div>

    </div>

  </section>


  <!-- =========================
       ENDING
  ========================== -->

  <section
    class="screen"
    id="endingScreen"
  >

    <div id="bloom"></div>


    <div
      class="ending-card"
      id="endingCard"
    >

      <!-- ORIGINAL ENDING -->

      <div id="systemEnding">

        <div class="system-label">
          system update complete
        </div>

        <div class="ending-title">
          Danielo v4.0
        </div>

        <div class="ending-sub">
          successfully installed
          <br><br>
          May contain improved luck, more wins.
        </div>

        <div class="system-details">

          <div class="detail">
            POWERED BY<br>
            <strong>Willpower</strong>
          </div>

          <div class="detail">
            STABILITY<br>
            <strong>Questionable</strong>
          </div>

        </div>

      </div>


      <!-- FINAL HAPPY BIRTHDAY -->

      <div
        id="finalBirthday"
        class="final-birthday"
      >

        <div class="final-label">
          final message
        </div>

        <div class="final-birthday-text">
          Happy Birthday, Danielo.
        </div>

      </div>

    </div>

  </section>


  <script>

    const birthdayMessage =
      "HAPPY BIRTHDAY DANIELO!!!";


    const personalMessage = `Happy birthday Danielo!!! 🎉

I hope you have the kind of birthday where everything goes your way for once 😂

All jokes aside, I'm really glad we're friends, and I hope this year brings you a lot of good memories, good people, more wins, and way less stress.

Keep being you, keep doing your thing, and please don't use your birthday as an excuse to make too many terrible decisions 😭

You deserve a really good year. Happy birthday, bro 🥳`;


    /* =========================
       CHANGE SCREEN
    ========================= */

    function changeScreen(id) {

      document
        .querySelectorAll(".screen")
        .forEach(screen => {

          screen.classList.remove(
            "active"
          );

        });


      document
        .getElementById(id)
        .classList.add(
          "active"
        );

    }


    /* =========================
       BIRTHDAY TYPING
    ========================= */

    const birthdayText =
      document.getElementById(
        "birthdayText"
      );


    const birthdayCursor =
      document.getElementById(
        "birthdayCursor"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    let birthdayIndex = 0;


    function typeBirthday() {

      birthdayText.textContent +=
        birthdayMessage.charAt(
          birthdayIndex
        );


      birthdayIndex++;


      if (
        birthdayIndex <
        birthdayMessage.length
      ) {

        setTimeout(
          typeBirthday,
          80
        );

      } else {

        setTimeout(() => {

          birthdayCursor.style.display =
            "none";


          continueButton
            .classList
            .add(
              "show"
            );

        }, 500);

      }

    }


    /* =========================
       SHOW GIFT
    ========================= */

    function showGift() {

      changeScreen(
        "giftScreen"
      );

    }


    /* =========================
       OPEN GIFT
    ========================= */

    function openGift() {

      const cube =
        document.getElementById(
          "glassCube"
        );


      if (
        cube.classList.contains(
          "open"
        )
      ) {

        return;

      }


      cube.classList.add(
        "open"
      );


      setTimeout(() => {

        changeScreen(
          "messageScreen"
        );


        setTimeout(() => {

          typePersonalMessage();

        }, 650);


      }, 1400);

    }


    /* =========================
       PERSONAL MESSAGE
    ========================= */

    function typePersonalMessage() {

      const typed =
        document.getElementById(
          "typedMessage"
        );


      const cursor =
        document.getElementById(
          "messageCursor"
        );


      typed.textContent =
        "";


      cursor.style.display =
        "inline";


      let index = 0;


      function typeLetter() {

        typed.textContent +=
          personalMessage.charAt(
            index
          );


        index++;


        if (
          index >=
          personalMessage.length
        ) {

          cursor.style.display =
            "none";


          setTimeout(() => {

            showEnding();

          }, 2600);


          return;

        }


        let speed =
          31;


        const current =
          personalMessage.charAt(
            index
          );


        if (
          current === "." ||
          current === "!" ||
          current === "?"
        ) {

          speed =
            140;

        }


        setTimeout(
          typeLetter,
          speed
        );

      }


      typeLetter();

    }


    /* =========================
       PARTICLE BLOOM
    ========================= */

    function particleBloom() {

      const container =
        document.getElementById(
          "bloom"
        );


      container.innerHTML =
        "";


      for (
        let i = 0;
        i < 85;
        i++
      ) {

        const particle =
          document.createElement(
            "div"
          );


        particle.classList.add(
          "bloom-particle"
        );


        const angle =
          Math.random()
          * Math.PI
          * 2;


        const distance =
          180
          + Math.random()
          * 700;


        const x =
          Math.cos(angle)
          * distance;


        const y =
          Math.sin(angle)
          * distance;


        const size =
          4
          + Math.random()
          * 16;


        particle.style.setProperty(
          "--x",
          x + "px"
        );


        particle.style.setProperty(
          "--y",
          y + "px"
        );


        particle.style.setProperty(
          "--size",
          size + "px"
        );


        particle.style.setProperty(
          "--duration",
          (
            1.7
            + Math.random()
            * 1.5
          ) + "s"
        );


        container.appendChild(
          particle
        );


        setTimeout(() => {

          particle.remove();

        }, 3500);

      }

    }


    /* =========================
       ENDING
    ========================= */

    function showEnding() {

      changeScreen(
        "endingScreen"
      );


      /* PARTICLE BLOOM */

      setTimeout(() => {

        particleBloom();

      }, 500);


      /*
        KEEP ORIGINAL ENDING
        ON SCREEN FIRST
      */

      setTimeout(() => {

        const systemEnding =
          document.getElementById(
            "systemEnding"
          );


        systemEnding.classList.add(
          "hide"
        );


        /*
          THEN SHOW
          HAPPY BIRTHDAY
          INSIDE SAME CARD
        */

        setTimeout(() => {

          systemEnding.style.display =
            "none";


          const finalBirthday =
            document.getElementById(
              "finalBirthday"
            );


          finalBirthday.classList.add(
            "show"
          );


          /*
            LET HAPPY BIRTHDAY
            SIT ON SCREEN
          */

          setTimeout(() => {

            finalBirthday.classList.add(
              "fade"
            );


            /*
              THEN FADE THE
              WHOLE GLASS CARD
            */

            setTimeout(() => {

              document
                .getElementById(
                  "endingCard"
                )
                .classList
                .add(
                  "final-fade"
                );

            }, 1200);


          }, 3200);


        }, 850);


      }, 5200);

    }


    /* =========================
       START
    ========================= */

    typeBirthday();

  </script>

</body>
</html>
